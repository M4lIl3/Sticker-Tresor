name: APK bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Signaturschlüssel vorbereiten
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "SIGNED=true" >> "$GITHUB_ENV"
          else
            echo "::warning::Kein KEYSTORE_BASE64-Secret – Test-APK mit Debug-Schlüssel, kein Release."
          fi

      - name: APK bauen
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: APK benennen
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk "out/Sticker-Tresor-v1.0.${{ github.run_number }}.apk"
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: Sticker-Tresor-APK
          path: out/*.apk

      - name: Release veröffentlichen
        if: env.SIGNED == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Sticker-Tresor v1.0.${{ github.run_number }}
          body: |
            APK zum Installieren auf dem Handy: unten unter **Assets** auf die `.apk` tippen.
          files: out/*.apk
          make_latest: true
